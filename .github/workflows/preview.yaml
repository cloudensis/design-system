name: Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - run: npm ci

      - run: npm run build:docs

      # 本番に切り替えずにバージョンだけを作り、プレビュー URL で確認する。
      # vite が出力する、パス解決済みの wrangler.json を使う。
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload -c docs-dist/cloudensis_design_system_docs/wrangler.json

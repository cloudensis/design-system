name: Workflow lint

on:
  pull_request:
    paths:
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ワークフローの危険な書き方（未固定の Action、テンプレートインジェクションなど）を検出する。
      - run: pipx run zizmor==1.32.0 --offline --min-severity medium .github/workflows

name: Publish

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  id-token: write # Trusted Publishing (OIDC) に必要
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # リリースビルドではキャッシュを使わない（npm の推奨）
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      - run: npm publish

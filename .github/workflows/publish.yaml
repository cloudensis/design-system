name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  publish:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing (OIDC) に必要
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      # package.json の version は 0.0.0 に固定し、Release のタグを version にして publish する。
      - run: npm version "$TAG" --no-git-tag-version
        env:
          TAG: ${{ github.event.release.tag_name }}
      # .npmrc の ignore-scripts で prepack などが動かないため、明示的にビルドする。
      - run: npm run build
      - run: npm publish

  # publish の成功後にデプロイする。
  deploy-docs:
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          # リリースのジョブでは、PR が書き込めるキャッシュを使わない（キャッシュポイズニング対策）。
          package-manager-cache: false

      - run: npm ci
      - run: npm run build:docs

      - run: npx cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

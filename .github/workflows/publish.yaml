name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yaml

  # タグと version が一致しなければ publish もデプロイもしない。
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version matches release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release のタグ ($TAG) と package.json の version ($VERSION) が一致しません"
            exit 1
          fi

  publish:
    needs: [test, check-version]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Trusted Publishing (OIDC) に必要
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci
      - run: npm run build
      - run: npm publish

  # publish の成功後にデプロイする。
  deploy-docs:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: "npm"

      - run: npm ci
      - run: npm run build:docs

      # vite が出力する、パス解決済みの wrangler.json を使う。
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c docs-dist/cloudensis_design_system_docs/wrangler.json

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: changesets
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in the repository
    # settings. The npm registry is immutable - a name/version pair can never
    # be reused - so a publish gets a human approval first, with the
    # `npm pack --dry-run` file list from CI in hand.
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm CLI; the one bundled with Node 22
      # predates it.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      - name: Build and verify
        run: npm run verify

      # Opens (or updates) the "Version Packages" PR when changesets are
      # pending, and publishes when that PR has been merged. Publishing happens
      # here and nowhere else - never from a personal machine.
      #
      # Authentication is npm Trusted Publishing (OIDC via id-token: write), so
      # no long-lived token is stored. NODE_AUTH_TOKEN is only consulted if
      # Trusted Publishing has not been configured for a package yet.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

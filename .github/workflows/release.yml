name: Release

# Publishing is tied to a published GitHub Release, not to a push to main.
# Cutting a release is then an explicit, dated act by a person, and the tag
# names exactly the commit that went to npm.
#
# The flow this expects:
#
#   1. every PR that changes a package carries a changeset (`npm run changeset`)
#   2. when it is time to release: `npm run version-packages` on a branch,
#      which consumes the changesets, bumps the versions, writes the
#      changelogs and refreshes the lockfile. Merge that.
#   3. publish a GitHub Release whose tag points at that commit. This runs.
#
# `changeset publish` works out which of the three packages are not yet on the
# registry at their current version and publishes only those, so one repository
# level tag is enough for three independently versioned packages.
on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # npm Trusted Publishing (OIDC). No long-lived token is stored.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment in the repository
    # settings. The npm registry is immutable - a name/version pair can never
    # be reused - so a publish gets a human approval first, with the
    # `npm pack --dry-run` file list from CI in hand.
    environment: npm
    steps:
      - uses: actions/checkout@v5
        with:
          # Build exactly what was tagged, not whatever main has drifted to.
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs a recent npm CLI; the one bundled with Node 22
      # predates it.
      - name: Update npm
        run: npm install -g npm@latest

      - run: npm ci

      # A release tag cut before `npm run version-packages` would carry the
      # previous versions, and `changeset publish` would find nothing new to
      # publish - or worse, silently publish nothing while looking successful.
      - name: Check the release is versioned
        run: node scripts/check-release-ready.mjs

      - name: Build and verify
        run: npm run verify

      - name: Publish
        run: npm run release
        env:
          # Only consulted when Trusted Publishing has not been configured for
          # a package yet.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
